services:
  # Microservice 1: Python FastAPI Backend (Video Streaming & Thumbnail service)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-backend
    environment:
      - VIDEO_DIR=/media/videos
      - CACHE_DIR=/app/cache
    env_file:
      - .env
    volumes:
      # Read-only bind mount of host video folder
      - /media/videos:/media/videos:ro
      # Live development mount for Python code
      - ./backend:/app
      # Named volume for persistent thumbnail cache
      - thumbnail-cache:/app/cache
    restart: unless-stopped

  # Microservice 2: Static Web Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Microservice 3: Nginx Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: video-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /media/videos:/media/videos:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Microservice 4: Cloudflare Tunnel Gateway (Secure remote access for your-public-hostname)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: video-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  thumbnail-cache:

