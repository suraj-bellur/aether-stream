version: '3.8'

services:
  # Microservice 1: Python FastAPI Backend (Video Streaming & Thumbnail service)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-backend
    environment:
      - VIDEO_DIR=/media/videos
      - CACHE_DIR=/app/cache
    volumes:
      # Read-only bind mount of 55GB host video folder mounted inside VM at /media/videos
      - /media/videos:/media/videos:ro
      # Named volume for persistent thumbnail cache
      - thumbnail-cache:/app/cache
    restart: unless-stopped

  # Microservice 2: Static Web Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-frontend
    restart: unless-stopped

  # Microservice 3: Nginx Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: video-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  thumbnail-cache:
