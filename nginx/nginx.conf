# Real client IP / protocol when traffic arrives through the Cloudflare Tunnel
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Compress text responses (the library JSON is ~190KB raw, ~10x smaller gzipped).
    # Images and video are already compressed and are left alone.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Public Login Endpoint
    location = /api/login {
        proxy_pass http://backend:8000/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Public Logout Endpoint (must work even if the session already expired)
    location = /api/logout {
        proxy_pass http://backend:8000/api/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Internal Auth Check Endpoint (cannot be accessed directly by users if protected, but Nginx needs it)
    location = /api/auth_check {
        internal;
        proxy_pass http://backend:8000/api/auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Protected Video Stream Route
    location /api/stream/ {
        auth_request /api/auth_check;
        alias /media/videos/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        # The media drive is a slow USB share: read in a thread pool so one slow read
        # never blocks the worker, and cap each sendfile call so streams share fairly
        aio threads;
        sendfile_max_chunk 1m;
        # Skip re-opening/stat-ing the file over the VirtualBox share on every range request
        open_file_cache max=500 inactive=120s;
        open_file_cache_valid 30s;
        open_file_cache_errors off;
        add_header Accept-Ranges bytes;
    }

    # Protected General API Route
    location /api/ {
        auth_request /api/auth_check;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The private site's theme lives in frontend/ next to the public one, but is not for this site
    location = /theme.private.css {
        return 404;
    }

    # Route all UI requests to Frontend Web container (Frontend handles showing login screen on 401)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
