server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Public Login Endpoint
    location = /api/login {
        proxy_pass http://backend:8000/api/login;
        proxy_set_header Host $host;
    }

    # Internal Auth Check Endpoint (cannot be accessed directly by users if protected, but Nginx needs it)
    location = /api/auth_check {
        internal;
        proxy_pass http://backend:8000/api/auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Protected Video Stream Route
    location /api/stream/ {
        auth_request /api/auth_check;
        alias /media/videos/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        add_header Accept-Ranges bytes;
    }

    # Protected General API Route
    location /api/ {
        auth_request /api/auth_check;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route all UI requests to Frontend Web container (Frontend handles showing login screen on 401)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
