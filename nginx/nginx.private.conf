# Gateway and web UI for the PRIVATE site (docker-compose.yml, service nginx-private, your-private-hostname).
# Same rules as nginx.conf, but pointed at the private backend and media folder, and it serves the UI itself.
# If you change a rule in nginx.conf (gzip, streaming, auth), mirror it here.

# Real client IP / protocol when traffic arrives through the Cloudflare Tunnel
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Keep this site out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Login Endpoint
    location = /api/login {
        proxy_pass http://backend-private:8000/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Logout Endpoint (must work even if the session already expired)
    location = /api/logout {
        proxy_pass http://backend-private:8000/api/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Internal Auth Check Endpoint (nginx calls it for every protected request)
    location = /api/auth_check {
        internal;
        proxy_pass http://backend-private:8000/api/auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Protected media route: the private folder is mounted at /media/private
    location /api/stream/ {
        auth_request /api/auth_check;
        alias /media/private/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;
        sendfile_max_chunk 1m;
        open_file_cache max=500 inactive=120s;
        open_file_cache_valid 30s;
        open_file_cache_errors off;
        add_header Accept-Ranges bytes;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Protected General API Route
    location /api/ {
        auth_request /api/auth_check;
        proxy_pass http://backend-private:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The web UI is served straight from here (the same files as the public frontend,
    # mounted at /usr/share/nginx/html, with the Noir red theme.css mounted over the empty one)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Label the private site: browser tab title and address-bar colour
        sub_filter_once on;
        sub_filter '<title>Aether Stream</title>' '<title>Aether &middot; Private</title>';
        sub_filter 'content="#06060a"' 'content="#030304"';
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
