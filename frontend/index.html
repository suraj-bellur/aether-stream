<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aether Stream - Cinematic Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4.2">
</head>
<body>

  <div class="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="brand-letter">A</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" title="Home" data-filter="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
        <button class="nav-item" title="Search" id="nav-search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="nav-item" title="Recent" data-filter="recent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
        <button class="nav-item" title="Large Files" data-filter="large">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </button>
        <button class="nav-item" title="Random Video" id="nav-random-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="stats-icon" title="Library Stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Top Search Bar (hidden by default) -->
      <div class="search-bar-container hidden" id="search-container">
        <svg class="search-icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Titles, people, genres" autocomplete="off">
        <button id="clear-search-btn" class="clear-btn hidden">&times;</button>
      </div>

      <!-- Hero Billboard -->
      <section class="hero-billboard hidden" id="hero-section">
        <div class="hero-image" id="hero-backdrop"></div>
        <div class="hero-vignette"></div>
        <div class="hero-vignette-bottom"></div>
        <div class="hero-content">
          <div class="hero-type-badge">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2z"></path></svg>
            AETHER ORIGINAL
          </div>
          <h1 class="hero-title" id="hero-title">Aether Stream</h1>
          <div class="hero-meta">
            <span class="match-score">98% Match</span>
            <span id="hero-year-badge">2026</span>
            <span class="maturity-rating">HD</span>
            <span id="hero-size-badge">0 MB</span>
          </div>
          <p class="hero-synopsis">Experience your personal video library in cinematic quality. High-performance streaming with seamless playback directly from your personal server.</p>
          <div class="hero-buttons">
            <button class="btn-play" id="hero-play-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              Play
            </button>
            <button class="btn-more-info">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              More Info
            </button>
          </div>
        </div>
      </section>

      <!-- Video Grid Rows -->
      <section class="catalog-section">
        <h2 class="row-title" id="row-title">Trending Now</h2>
        
        <!-- Skeleton -->
        <div id="skeleton-grid" class="video-grid">
          <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
        
        <!-- Empty -->
        <div id="empty-state" class="empty-state hidden">
          <p id="empty-desc">No titles found.</p>
        </div>

        <!-- Grid -->
        <div id="video-grid" class="video-grid hidden"></div>
        
        <!-- Pagination -->
        <div id="pagination-wrapper" class="pagination-wrapper hidden">
          <button id="prev-page-btn" class="pagination-btn" disabled>
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div id="page-numbers" class="page-numbers"></div>
          <button id="next-page-btn" class="pagination-btn">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </section>
      
      <!-- Footer -->
      <footer class="app-footer">
        <p>Aether Stream &copy; 2026 &bull; <span id="video-count-text">0 Videos</span></p>
      </footer>
    </main>
  </div>

  <!-- Cinema Player Modal -->
  <div id="player-modal" class="player-modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-top-bar">
        <button id="modal-shuffle-btn" class="modal-action-btn" aria-label="Shuffle Video" title="Play Another Random Video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button id="modal-close-btn" class="modal-action-btn" aria-label="Close modal" title="Close Player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="video-screen-container">
        <video id="main-video-player" controls controlsList="nodownload" oncontextmenu="return false;" preload="auto" playsinline>
          Your browser does not support HTML5 video playback.
        </video>
      </div>
  </div>

  <script src="app.js?v=4.3"></script>
</body>
</html>
