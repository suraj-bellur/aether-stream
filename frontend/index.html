<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aether Stream - Cinema Experience</title>
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Cache-Busted CSS -->
  <link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>

  <!-- Sticky Glassmorphic Navbar -->
  <header class="app-header">
    <div class="nav-container">
      <a href="#" class="brand-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <span class="brand-name">AETHER<span class="brand-accent">STREAM</span></span>
      </a>

      <!-- Search Bar -->
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search videos, movies, clips..." autocomplete="off">
        <button id="clear-search-btn" class="clear-btn hidden" aria-label="Clear search">&times;</button>
        <span class="kbd-badge">/</span>
      </div>

      <!-- Right Header Actions -->
      <div class="header-actions">
        <div class="stats-badge" id="video-stats-badge">
          <span class="pulse-dot"></span>
          <span id="video-count-text">0 Videos</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="main-content">

    <!-- Featured Spotlight Hero Section -->
    <section id="hero-section" class="hero-section hidden">
      <div class="hero-card">
        <div class="hero-backdrop" id="hero-backdrop"></div>
        <div class="hero-gradient-overlay"></div>
        
        <div class="hero-info-content">
          <span class="hero-badge">FEATURED STREAM</span>
          <h1 id="hero-title" class="hero-title">Video Title Loading...</h1>
          <p class="hero-meta">
            <span id="hero-size-badge" class="meta-tag">0 MB</span>
            <span class="meta-tag quality">HD 1080p</span>
            <span class="meta-tag">Fast Stream</span>
          </p>
          <div class="hero-actions">
            <button id="hero-play-btn" class="btn btn-primary">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              Play Now
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Library Controls & Filters -->
    <section class="controls-section">
      <div class="section-title-group">
        <h2>Video Library</h2>
        <span class="section-subtitle">Explore self-hosted video collection</span>
      </div>

      <!-- Category Filter Pills -->
      <div class="filter-pills" id="filter-pills">
        <button class="pill-btn active" data-filter="all">All Videos</button>
        <button class="pill-btn" data-filter="recent">Latest Added</button>
        <button class="pill-btn" data-filter="large">Large Files (>500MB)</button>
      </div>
    </section>

    <!-- Video Grid Section -->
    <section class="grid-section">
      
      <!-- Skeleton Loading State -->
      <div id="skeleton-grid" class="video-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state-wrapper hidden">
        <div class="empty-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12h8"></path>
          </svg>
        </div>
        <h3 id="empty-title">No Videos Found</h3>
        <p id="empty-desc">We couldn't find any videos matching your query. Place MP4 files in your server directory.</p>
      </div>

      <!-- Main Video Card Grid -->
      <div id="video-grid" class="video-grid hidden"></div>
    </section>

  </main>

  <!-- Cinema Player Modal -->
  <div id="player-modal" class="player-modal-overlay hidden">
    <div class="modal-window">
      
      <!-- Modal Header -->
      <div class="modal-top-bar">
        <div class="modal-title-box">
          <span class="live-pill"><span class="live-dot"></span> STREAMING NOW</span>
          <h3 id="modal-video-title">Video Title</h3>
        </div>
        <button id="modal-close-btn" class="modal-close-icon" aria-label="Close modal">&times;</button>
      </div>

      <!-- Main Player Layout (Player + Up Next Sidebar) -->
      <div class="modal-body-layout">
        
        <!-- Video Screen Container -->
        <div class="video-screen-container">
          <video id="main-video-player" controls preload="auto" playsinline>
            Your browser does not support HTML5 video playback.
          </video>
        </div>

        <!-- Up Next Playlist Sidebar -->
        <aside class="up-next-sidebar">
          <div class="sidebar-header">
            <h4>Up Next</h4>
            <span id="up-next-count" class="count-tag">0 Videos</span>
          </div>
          <div id="up-next-list" class="up-next-scroll"></div>
        </aside>

      </div>
    </div>
  </div>

  <script src="app.js?v=2.1"></script>
</body>
</html>
